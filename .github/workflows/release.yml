name: Validate Agent Sphere composition

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated main package and installer through the release environment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install namespace verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap gnupg openssh-server
      - name: Build and verify package and installer
        env:
          AGPC_BOOTSTRAP_NAMESPACE_SUDO: "1"
        run: |
          python3 scripts/package.py build
          python3 -m unittest discover -s tests -v
          bash -n agpc.sh agpc-all.sh agent-sphere-apps.sh
          python3 scripts/embed-installer-support.py
      - name: Verify direct CX retirement with genuine archives
        run: sudo python3 scripts/check-cx-retirement.py
      - name: Bind source artifacts
        run: |
          python3 scripts/package.py manifest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-sphere-composition
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    environment: release
    concurrency:
      group: agent-sphere-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: agent-sphere-composition
          path: dist
      - name: Publish exact validated main artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -c 'import json; p=json.load(open("component-baseline.json")); assert not p.get("pending_native_components"), "Native component artifacts remain required before publication"'
          version=$(sed -n 's/^Version: //p' packaging/control)
          python3 scripts/package.py verify "dist/agent-sphere_${version}_all.deb"
          python3 scripts/package.py verify "dist/mote-chatd_2.0.0-9_all.deb"
          cmp agpc.sh dist/agpc.sh
          cmp agpc-all.sh dist/agpc-all.sh
          cmp agent-sphere-apps.sh dist/agent-sphere-apps.sh
          gh release create "v${version}" dist/* --target "$GITHUB_SHA" --title "Agent Sphere ${version}" --notes-file RELEASE_NOTES.md --prerelease --latest=false
